<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Museum · LI ZHONGYU</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/museum.css">
</head>
<body data-page="museum">
<main>
  <section class="museum-page">
    <p class="label">MY MUSEUM</p>
    <div class="editorial-intro museum-intro" aria-label="Museum introduction">
      <p data-intro-lang="zh">这里将用于记录和展示我的个人收藏。</p>
      <p data-intro-lang="en">A place to document and display items from my personal collection.</p>
    </div>
    <nav class="museum-categories" aria-label="Collection categories">
      <button class="museum-chip active" type="button" data-type="all"><span data-intro-lang="en">All</span><span data-intro-lang="zh">全部</span></button>
      <button class="museum-chip" type="button" data-type="album"><span data-intro-lang="en">Albums</span><span data-intro-lang="zh">集邮册</span></button>
      <button class="museum-chip" type="button" data-type="stamp"><span data-intro-lang="en">Stamps</span><span data-intro-lang="zh">邮票</span></button>
      <button class="museum-chip" type="button" data-type="other"><span data-intro-lang="en">Other</span><span data-intro-lang="zh">其他</span></button>
    </nav>
    <div id="museumGrid" class="museum-grid" aria-live="polite"></div>
    <p id="museumEmpty" class="museum-empty muted" hidden></p>
  </section>
</main>
<script src="js/main.js" defer></script>
<script src="js/museum.js" defer></script>
</body>
</html>

name: Generate Global View Image Derivatives

on:
  push:
    paths:
      - "global_view_photo/**"
      - ".github/workflows/globalview-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derivatives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: python -m pip install --upgrade pillow pillow-heif

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Generate Global View derivatives
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_heif

          pillow_heif.register_heif_opener()

          source_root = Path("global_view_photo")
          thumb_root = Path("global-view-thumbs")
          display_root = Path("global-view-display")
          extensions = {".jpg", ".jpeg", ".png", ".heic", ".heif", ".webp"}

          expected_thumbs = set()
          expected_display = set()

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue

              relative = source.relative_to(source_root)
              thumb = thumb_root / relative.with_suffix(".webp")
              display = display_root / relative.with_suffix(".webp")
              expected_thumbs.add(thumb)
              expected_display.add(display)
              thumb.parent.mkdir(parents=True, exist_ok=True)
              display.parent.mkdir(parents=True, exist_ok=True)

              try:
                  with Image.open(source) as image:
                      image = ImageOps.exif_transpose(image)
                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "A" in image.getbands() else "RGB")

                      thumb_image = image.copy()
                      thumb_image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                      thumb_image.save(thumb, "WEBP", quality=82, method=6)

                      display_image = image.copy()
                      display_image.thumbnail((2400, 2400), Image.Resampling.LANCZOS)
                      display_image.save(display, "WEBP", quality=85, method=6)
              except Exception as exc:
                  print(f"Skipping {source}: {exc}")

          for root, expected in ((thumb_root, expected_thumbs), (display_root, expected_display)):
              if root.exists():
                  for old in root.rglob("*"):
                      if old.is_file() and old not in expected:
                          old.unlink()

          print("Global View derivative generation complete.")
          PY

      - name: Commit derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-view-thumbs global-view-display
          if git diff --cached --quiet; then
            echo "No derivative changes."
            exit 0
          fi
          git commit -m "Generate Global View image derivatives"
          git push

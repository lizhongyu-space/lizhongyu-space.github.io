name: Generate Gallery Image Derivatives

on:
  push:
    paths:
      - "gallery/**"
      - ".github/workflows/gallery-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derivatives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: python -m pip install --upgrade pillow pillow-heif

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Generate Gallery thumbnails
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_heif

          pillow_heif.register_heif_opener()

          source_root = Path("gallery")
          thumb_root = Path("gallery-thumbs")
          extensions = {".jpg", ".jpeg", ".png", ".heic", ".heif", ".webp"}

          expected_thumbs = set()

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue

              relative = source.relative_to(source_root)
              thumb = thumb_root / relative.with_suffix(".webp")
              expected_thumbs.add(thumb)
              thumb.parent.mkdir(parents=True, exist_ok=True)

              try:
                  with Image.open(source) as image:
                      image = ImageOps.exif_transpose(image)
                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "A" in image.getbands() else "RGB")

                      thumb_image = image.copy()
                      thumb_image.thumbnail((480, 480), Image.Resampling.LANCZOS)
                      thumb_image.save(thumb, "WEBP", quality=55, method=6)
              except Exception as exc:
                  print(f"Skipping {source}: {exc}")

          if thumb_root.exists():
              for old in thumb_root.rglob("*"):
                  if old.is_file() and old not in expected_thumbs:
                      old.unlink()

          display_root = Path("gallery-display")
          if display_root.exists():
              import shutil
              shutil.rmtree(display_root)

          print("Gallery thumbnail generation complete.")
          PY

      - name: Commit derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gallery-thumbs gallery-display
          if git diff --cached --quiet; then
            echo "No derivative changes."
            exit 0
          fi
          git commit -m "Optimize Gallery thumbnails"
          git push

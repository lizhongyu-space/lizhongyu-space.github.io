name: Generate Gallery Thumbnails

on:
  push:
    paths:
      - "gallery/**"
      - ".github/workflows/gallery-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        run: python -m pip install --upgrade pillow pillow-heif

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Generate WebP thumbnails
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_heif

          pillow_heif.register_heif_opener()

          source_root = Path("gallery")
          target_root = Path("gallery-thumbs")
          extensions = {".jpg", ".jpeg", ".png", ".heic", ".heif", ".webp"}

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue

              relative = source.relative_to(source_root)
              target = target_root / relative.with_suffix(".webp")
              target.parent.mkdir(parents=True, exist_ok=True)

              try:
                  with Image.open(source) as image:
                      image = ImageOps.exif_transpose(image)
                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                      image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                      image.save(target, "WEBP", quality=82, method=6)
              except Exception as exc:
                  print(f"Skipping {source}: {exc}")

          print("Thumbnail generation complete.")
          PY

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "Generate Gallery thumbnails"
          git push
